<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Venue Management | EventPark
    </title>


    <!-- Common Styles -->
    <link
        rel="stylesheet"
        href="../../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../../css/responsive.css"
    >

    <link
        rel="stylesheet"
        href="../../css/admin.css"
    >
</head>


<body>

    <!-- =====================================================
         ADMIN PAGE
         ===================================================== -->

    <main class="admin-page">

        <section class="admin-page-header">

            <div>

                <h1>
                    Venue Management
                </h1>

                <p>
                    Create, update and manage event venues.
                </p>

            </div>

        </section>


        <!-- =================================================
             MESSAGE
             ================================================= -->

        <div
            id="venueMessage"
            class="alert hidden"
        ></div>


        <!-- =================================================
             VENUE FORM
             ================================================= -->

        <section class="admin-card">

            <div class="admin-card-header">

                <h2 id="venueFormTitle">
                    Add New Venue
                </h2>

            </div>


            <form id="venueForm">

                <input
                    type="hidden"
                    id="venueId"
                >


                <div class="form-group">

                    <label for="venueName">
                        Venue Name
                    </label>

                    <input
                        type="text"
                        id="venueName"
                        placeholder="Enter venue name"
                        maxlength="150"
                        required
                    >

                    <small
                        id="venueNameError"
                        class="field-error"
                    ></small>

                </div>


                <div class="form-group">

                    <label for="venueAddress">
                        Address
                    </label>

                    <input
                        type="text"
                        id="venueAddress"
                        placeholder="Enter venue address"
                        maxlength="300"
                        required
                    >

                    <small
                        id="venueAddressError"
                        class="field-error"
                    ></small>

                </div>


                <div class="form-group">

                    <label for="venueCapacity">
                        Total Capacity
                    </label>

                    <input
                        type="number"
                        id="venueCapacity"
                        placeholder="Enter venue capacity"
                        min="1"
                        required
                    >

                    <small
                        id="venueCapacityError"
                        class="field-error"
                    ></small>

                </div>


                <div class="form-actions">

                    <button
                        type="submit"
                        id="saveVenueButton"
                        class="btn btn-primary"
                    >
                        Add Venue
                    </button>


                    <button
                        type="button"
                        id="cancelVenueEditButton"
                        class="btn btn-secondary hidden"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </section>


        <!-- =================================================
             VENUE LIST
             ================================================= -->

        <section class="admin-card">

            <div class="admin-card-header">

                <div>

                    <h2>
                        Venues
                    </h2>

                    <p>
                        All venues currently available in the system.
                    </p>

                </div>


                <button
                    type="button"
                    id="refreshVenuesButton"
                    class="btn btn-secondary"
                >
                    Refresh
                </button>

            </div>


            <!-- Loading -->

            <div
                id="venueLoading"
                class="hidden"
            >
                Loading venues...
            </div>


            <!-- Empty State -->

            <div
                id="venueEmpty"
                class="hidden"
            >
                No venues found.
            </div>


            <!-- Table -->

            <div class="table-responsive">

                <table class="admin-table">

                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Venue
                            </th>

                            <th>
                                Address
                            </th>

                            <th>
                                Capacity
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="venueTableBody">

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="../../js/config.js"></script>

    <script src="../../js/api.js"></script>

    <script src="../../js/common.js"></script>

    <script src="../../js/admin/venues.js"></script>

</body>

</html>
